# kind cluster config: single node, with hostPort mappings so an Ingress
# controller (if ever enabled) is reachable without a LoadBalancer. Not
# strictly required today — ingress.enabled defaults to false — but wiring
# it up now means enabling ingress later needs no cluster recreation.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
