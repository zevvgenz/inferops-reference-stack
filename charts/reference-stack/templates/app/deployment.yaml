apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reference-stack.fullname" . }}-app
  labels:
    {{- include "reference-stack.componentSelectorLabels" (dict "component" "app" "context" $) | nindent 4 }}
    {{- include "reference-stack.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # -- Wave 1: after the migration Job (0). On the ArgoCD path this
    # Deployment is not even created until the Job reports Completed —
    # see templates/migration/argocd-job.yaml for the full rationale.
    # The plain-Helm path has no equivalent wave mechanism; there,
    # /readyz below is what gates it instead (see docs/decisions.md
    # "Migration ordering (round 1)" and "(round 2)").
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "reference-stack.componentSelectorLabels" (dict "component" "app" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reference-stack.componentSelectorLabels" (dict "component" "app" "context" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "reference-stack.serviceAccountName" . }}
      # -- On the plain-Helm path, this pod starts immediately, in
      # parallel with the migration Job (post-install/post-upgrade hook —
      # see templates/migration/job.yaml). It is not gated by hook
      # timing there: the readinessProbe below hits /readyz, which stays
      # false until the Job has created the schema, so the pod never
      # receives traffic before the stack is actually usable. On the
      # ArgoCD path, the sync-wave annotation above means this Deployment
      # isn't created at all until the Job completes — /readyz is
      # redundant there but harmless to leave on. See docs/decisions.md
      # "Migration ordering".
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "reference-stack.fullname" . }}-config
            - secretRef:
                name: {{ include "reference-stack.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
