apiVersion: v1
kind: Service
metadata:
  name: {{ include "reference-stack.fullname" . }}-app
  labels:
    {{- include "reference-stack.componentSelectorLabels" (dict "component" "app" "context" $) | nindent 4 }}
    {{- include "reference-stack.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # -- Wave 1: see templates/app/deployment.yaml.
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "reference-stack.componentSelectorLabels" (dict "component" "app" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
