apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reference-stack.fullname" . }}-config
  labels:
    {{- include "reference-stack.labels" . | nindent 4 }}
data:
  # -- Non-secret app configuration. Credentials live in the Secret instead.
  POSTGRES_HOST: {{ include "reference-stack.postgresHost" . }}
  POSTGRES_PORT: {{ .Values.postgres.service.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  REDIS_HOST: {{ include "reference-stack.redisHost" . }}
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
