{{/*
Secret values arrive via `-f secrets/secrets.dec.yaml` at install time
(see `make secrets-decrypt` and `make install`). That file is produced by
decrypting secrets/secrets.enc.yaml with SOPS + age and is gitignored — it
must never be committed. This template only reads .Values.secrets.*, it
does not know about SOPS at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reference-stack.fullname" . }}-secret
  labels:
    {{- include "reference-stack.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # -- Wave -2: ahead of Postgres/Redis (-1) and the migration Job (0)
    # — see templates/migration/argocd-job.yaml for the full ordering
    # rationale. Stateless, no PVC risk, unlike Postgres.
    argocd.argoproj.io/sync-wave: "-2"
  {{- end }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required — run `make secrets-decrypt` and pass -f secrets/secrets.dec.yaml" .Values.secrets.postgresPassword | quote }}
