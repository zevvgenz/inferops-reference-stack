apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "reference-stack.fullname" . }}-postgres
  labels:
    {{- include "reference-stack.componentSelectorLabels" (dict "component" "postgres" "context" $) | nindent 4 }}
    {{- include "reference-stack.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # -- Wave -1: ahead of the migration Job (0) and the app (1), behind
    # Secret/ConfigMap (-2) which it doesn't actually consume but which
    # establishes the intended reading order. See
    # templates/migration/argocd-job.yaml for the full rationale. No
    # hook involved — this is an ordinary resource, deliberately never
    # made a hook resource (see docs/decisions.md "PVC lifecycle" for why
    # that would be dangerous for a StatefulSet's PVC).
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
spec:
  serviceName: {{ include "reference-stack.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "reference-stack.componentSelectorLabels" (dict "component" "postgres" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reference-stack.componentSelectorLabels" (dict "component" "postgres" "context" $) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "reference-stack.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reference-stack.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  # -- volumeClaimTemplates, not a standalone PVC manifest: this is the
  # correct pattern for a StatefulSet and is what gives each replica (were
  # this ever scaled beyond 1) its own persistent volume.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
