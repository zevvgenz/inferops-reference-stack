{{/*
GitOps path: an ordinary (non-hook) Job ordered by sync-wave, not an
ArgoCD PreSync/PostSync hook. Mutually exclusive with job.yaml — see the
`if` guard below and .Values.argocd.enabled. Do not enable both; the
migration would run twice per sync.

Why sync-wave, not a hook: see docs/decisions.md "Migration ordering
(ArgoCD): sync-waves, not hooks". Both hook phases deadlock or reproduce
the pre-install chicken-and-egg problem:
  - PostSync deadlocks — ArgoCD's sync operation waits for the main
    wave's resources (including the app Deployment) to report Healthy
    BEFORE running PostSync hooks, but the Deployment can only become
    Healthy once /readyz is happy, which itself depends on this Job
    having run. There's no --wait flag to remove here, unlike the
    plain-Helm path: ArgoCD's sync semantics always wait on wave health
    before advancing.
  - PreSync runs before ANY ordinary resource in the release, reproducing
    the plain-Helm pre-install problem: Postgres wouldn't exist yet, and
    wait-for-postgres would poll a Service that is never coming — nothing
    in that phase creates it.
Sync-waves solve this properly: they're ArgoCD's native ordering
mechanism for the normal reconciliation flow, not an escape hatch for
work that happens outside it. Wave -2 (Secret/ConfigMap) -> wave -1
(Postgres/Redis) -> wave 0 (this Job) -> wave 1 (app Deployment/Service).
ArgoCD waits for each wave's resources to report Healthy before starting
the next; healthy for a Job means Completed. The app Deployment is
therefore never even created until this Job has finished — ordering
without a hook and without a deadlock.
*/}}
{{- if .Values.argocd.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reference-stack.fullname" . }}-migration
  labels:
    {{- include "reference-stack.componentSelectorLabels" (dict "component" "migration" "context" $) | nindent 4 }}
    {{- include "reference-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "reference-stack.componentSelectorLabels" (dict "component" "migration" "context" $) | nindent 8 }}
    spec:
      restartPolicy: Never
      # Intentionally runs under the namespace default ServiceAccount.
      # The migration job only talks to PostgreSQL — it makes no Kubernetes
      # API calls, so it needs no RBAC.
      # -- Wave -1 puts Postgres ahead of this Job, so this initContainer
      # is a safety margin against a slow Postgres cold start, not a
      # workaround for missing ordering (contrast with the plain-Helm
      # path, where it's load-bearing because Postgres starts in
      # parallel with the Job).
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "reference-stack.postgresHost" . }} -p {{ .Values.postgres.service.port }} -U {{ .Values.postgres.auth.username }}; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "reference-stack.fullname" . }}-config
            - secretRef:
                name: {{ include "reference-stack.fullname" . }}-secret
      # -- 300s: this Job is what gates the app Deployment's very creation
      # on the ArgoCD path (see the comment above) — a hung migration
      # should fail loudly within a bounded time rather than leave the
      # sync looking perpetually "in progress" with no obvious cause.
      activeDeadlineSeconds: 300
{{- end }}
